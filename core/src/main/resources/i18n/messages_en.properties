finding.server.health.tick_degradation.title=Server tick health is degraded
finding.server.health.tick_degradation.description=Current TPS is {tps} and MSPT is {mspt}.
finding.server.health.tick_degradation.action=Inspect current chunk hotspots, entity totals and event bursts. Reduce the largest hotspot first.
finding.server.health.tick_degradation.cause.chunk=The heaviest current signal is chunk {chunkX},{chunkZ} in {world} with {entities} entities and {blockEntities} block entities.
finding.server.health.tick_degradation.cause.event_burst=The strongest correlated signal is event burst {eventId} peaking at {maxWindowCount} hits per window.
finding.server.health.tick_degradation.cause.entity_pressure=Entity pressure is already above the configured high-entity threshold.
finding.server.health.tick_degradation.cause.generic=The current metrics show tick slowdown, but no single correlated hotspot is dominant yet.
finding.server.entities_spike.title=Entity count has spiked
finding.server.entities_spike.description=Total entities are {entities}, baseline over recent samples is {baseline}.
finding.server.entities_spike.cause=A farm, mob accumulation, or chunk load area is increasing entity processing cost.
finding.server.entities_spike.action=Find the busiest chunk or world, then limit passive mob buildup and stacked farms.
finding.server.memory_pressure.title=JVM memory pressure is high
finding.server.memory_pressure.description=Heap usage is at {heapPercent}% of the configured max heap.
finding.server.memory_pressure.cause=Allocation pressure or retained objects are pushing the server close to a GC-heavy state.
finding.server.memory_pressure.action=Check recent entity and chunk growth, then review plugin activity during the same period.
finding.chunk.hotspot.title=Suspicious chunk hotspot detected
finding.chunk.hotspot.description=Chunk {chunkX},{chunkZ} in {world} has {entities} entities and {blockEntities} block entities.
finding.chunk.hotspot.cause=This chunk is significantly heavier than normal and is likely contributing to tick cost.
finding.chunk.hotspot.action=Teleport to the chunk, inspect farms or block-entity clusters, and trim the dominant source first.
finding.event.burst.title=Frequent event burst observed
finding.event.burst.description=Event {eventId} peaked at {maxWindowCount} executions per {windowSeconds}s window.
finding.event.burst.cause=A hot gameplay loop or plugin reaction chain is generating this event much faster than its recent baseline.
finding.event.burst.action=Correlate this event with the listed plugins and current chunk/world hotspots before disabling anything.
finding.server.chunks_spike.title=Loaded chunk count has jumped
finding.server.chunks_spike.description=Loaded chunks are {loadedChunks}, baseline over recent samples is {baseline}.
finding.server.chunks_spike.cause=Players, teleport chains or plugins are holding more chunks loaded than before.
finding.server.chunks_spike.action=Check teleport activity, chunk loaders and the busiest world for runaway chunk retention.
finding.server.unstable_trend.title=Server health trend is unstable
finding.server.unstable_trend.description=Recent MSPT/TPS averages moved from {olderMspt}/{olderTps} to {newerMspt}/{newerTps}.
finding.server.unstable_trend.cause=The server is degrading across recent samples rather than from one isolated spike.
finding.server.unstable_trend.action=Watch chunk loading, entity growth and event bursts over the next minute to identify what is rising with the trend.

